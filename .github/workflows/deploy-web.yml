name: Deploy web to GitHub Pages

# Builds the Expo web app and publishes dist/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Source = "GitHub Actions".
#
# Optional: to enable Clara + AI on the deployed site WITHOUT exposing the
# Gemini key in the client bundle, deploy the Cloudflare Worker in proxy/ and add
# a repo variable EXPO_PUBLIC_AI_PROXY_URL (Settings → Secrets and variables →
# Actions → Variables). Never put the raw key here — it would ship to browsers.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Pages serves a project site from /<repo>/. app.config.js bakes this base
      # path into every asset URL via Expo's experiments.baseUrl.
      - name: Build web
        env:
          EXPO_PUBLIC_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_AI_PROXY_URL: ${{ vars.EXPO_PUBLIC_AI_PROXY_URL }}
        run: npx expo export --platform web
      - name: Add SPA + Jekyll-bypass files
        run: |
          cp dist/index.html dist/404.html   # client-side routing fallback
          touch dist/.nojekyll               # let _expo/ assets through
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
